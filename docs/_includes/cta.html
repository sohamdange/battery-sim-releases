<section class="cta">
  <div class="wrap cta-inner reveal">
    <div class="cta-charge" aria-hidden="true">
      <div class="charge-bar"><span></span></div>
    </div>
    <h2>Ready to simulate your pack?</h2>
    <p>Download Battery Sim Suite for Windows and get a free licence key in a few seconds.</p>
    <div class="actions actions--center">
      <a class="btn btn-charge btn-lg" href="{{ '/downloads/' | relative_url }}">{% include icon.html name="download" px=18 %}Download for Windows</a>
      <a class="btn btn-ghost btn-lg" href="{{ '/licence/' | relative_url }}">{% include icon.html name="key" px=18 %}Get a free licence key</a>
    </div>
  </div>
</section>
