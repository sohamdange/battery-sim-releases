<div class="tabs reveal" data-tabs>
  <div class="tab-list" role="tablist" aria-label="Screenshots">
    {%- for s in site.data.screens %}
    <button class="tab" type="button" role="tab" id="tab-{{ s.id }}" aria-controls="panel-{{ s.id }}" aria-selected="{% if forloop.first %}true{% else %}false{% endif %}"{% unless forloop.first %} tabindex="-1"{% endunless %}>{{ s.tab }}</button>
    {%- endfor %}
  </div>
  {%- for s in site.data.screens %}
  <div class="tab-panel" role="tabpanel" id="panel-{{ s.id }}" aria-labelledby="tab-{{ s.id }}"{% unless forloop.first %} hidden{% endunless %}>
    <figure class="frame">
      <div class="frame-bar" aria-hidden="true"><i></i><i></i><i></i><span class="mono">{{ s.tab }}</span></div>
      <img src="{{ s.image | relative_url }}" alt="{{ s.alt }}" loading="lazy" width="1440" height="900">
    </figure>
    <p class="tab-caption">{{ s.caption }}</p>
  </div>
  {%- endfor %}
</div>
