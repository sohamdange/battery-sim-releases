<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include csp.html %}
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0A0F1F">
  {%- if page.noindex %}
  <meta name="robots" content="noindex">
  {%- endif %}
  {% seo %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/space-grotesk.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script src="{{ '/assets/js/boot.js' | relative_url }}"></script>
</head>
<body class="layout-{{ page.layout | default: 'default' }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {%- if page.live_release %}
  <script src="{{ '/assets/js/release-info.js' | relative_url }}" defer></script>
  {%- endif %}
  {%- if page.csp == "licence" %}
  <script src="{{ '/assets/js/licence.js' | relative_url }}" defer></script>
  {%- endif %}
</body>
</html>
