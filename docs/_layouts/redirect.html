<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  {% include csp.html %}
  <title>Moved &mdash; {{ site.title }}</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  {%- if page.redirect_hashes %}
  <script src="{{ '/assets/js/redirect-hash.js' | relative_url }}" data-target="{{ page.redirect_to | relative_url }}" data-map='{{ page.redirect_hashes | jsonify }}'></script>
  {%- endif %}
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
</head>
<body>
  <p>This page has moved to <a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_to | absolute_url }}</a>.</p>
</body>
</html>
