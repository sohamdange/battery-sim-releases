---
layout: default
---
{%- if page.hero_title %}
<section class="page-hero">
  <div class="circuit-bg" aria-hidden="true"></div>
  <div class="wrap">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-title">{{ page.hero_title }}</h1>
    {%- if page.hero_lede %}<p class="page-lede">{{ page.hero_lede }}</p>{% endif %}
  </div>
</section>
{%- endif %}
{{ content }}
