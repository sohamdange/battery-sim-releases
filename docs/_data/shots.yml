# Screenshots used on the site, one entry per image.
#
# To add or replace one, save a PNG at docs/screenshots/<file>.
# Pages use {% include shot.html id="<id>" %}: while the file is missing a
# placeholder is shown, and as soon as it exists the screenshot appears.
#
# Capture guidance for every image:
#   - Battery Sim Suite 0.3.0, window at 1440 x 900 (16:10), dark theme
#   - realistic demo data, no customer names or personal file paths
#   - PNG, under ~500 KB if possible

# ---- Home page tour and Features page ----
- id: dashboard
  file: dashboard.png
  title: Home dashboard
  alt: Home dashboard with simulation counts, cell and pack totals, and recent activity
  capture: Home page with a populated library (several cells, packs, simulations) and recent runs listed.
- id: cells
  file: cells.png
  title: Cell Library
  alt: Cell library listing LG M50T cells with their models and readiness
  capture: Cell Library with a few cells and their model configurations.
- id: sims
  file: sim-library.png
  title: Simulation Library
  alt: Simulation library listing runs with status, pack, simulation cycle, end SOC and peak temperature
  capture: Simulation Library in list view with completed runs.
- id: results
  file: results.png
  title: Results
  alt: Pack voltage over a three-day run in the results plots
  capture: Results plots of a completed pack run, Pack Level tab.
- id: cycles
  file: schedule-library.png
  title: Simulation Scenario Builder
  alt: Schedule library listing simulation cycles, including a ten-year cycle
  capture: Schedule Library with simulation cycles, one of them multi-year.

# ---- Guide and feature pages ----
- id: cell-builder
  file: cell-builder.png
  title: Cell Builder
  alt: Cell Builder Models tab listing named electrochemical configurations
  capture: Cell Builder, Models tab, showing several configurations of one cell.
- id: pack-builder
  file: pack-builder.png
  title: Pack Builder
  alt: Pack Builder layout of a 12 by 16 cell module with its parallel groups
  capture: Pack Builder layer layout with parallel groups coloured.
- id: thermal-setup
  file: thermal-setup.png
  title: Thermal connections
  alt: Pack Builder thermal connections between neighbouring cells, with their thermal resistances
  capture: Pack Builder thermal connections table and connection diagram for the same pack.
- id: thermal-map
  file: thermal-map.png
  title: Temperature across the pack
  alt: Spatial heat map of cell temperatures across a 192-cell module, warmer on the side away from the air inlet
  capture: Results, Spatial tab, cell temperature part-way through an air-cooled run.
- id: sequence-builder
  file: sequence-builder.png
  title: Sequence editor
  alt: Sequence editor step table with discharge, rest, constant-current and constant-voltage charge steps
  capture: Editing a sequence with a mix of trigger-only and fixed steps.
- id: simulation-cycle
  file: simulation-cycle.png
  title: Simulation cycle
  alt: Simulation cycle with a heavy first year followed by nine years of residential use
  capture: Editing a multi-year simulation cycle with two year-profile lines.
- id: simulation-setup
  file: simulation-setup.png
  title: Simulation setup
  alt: Simulation setup with a pack and a ten-year simulation cycle selected
  capture: Simulation setup, Selection step, with a pack and a multi-year simulation cycle chosen.
- id: engine-picker
  file: engine-picker.png
  title: Choosing a model
  alt: Model selector listing the built-in and PyBaMM models, with those the cell cannot run marked unavailable
  capture: Model selector open in the run setup.
- id: ageing-panel
  file: ageing-panel.png
  title: Ageing panel
  alt: Ageing panel showing pack state of health, capacity lost and the weakest cell over a run
  capture: Results Ageing panel from an SPM run with SEI growth on.
- id: addon-install
  file: addon-install.png
  title: The add-on in Settings
  alt: Settings About section showing the Electrochemical Models Add-On installed, version 11.1
  capture: Settings, About section, showing the Electrochemical Models Add-On card.
